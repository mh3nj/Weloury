name: release

# Builds the desktop app for every supported OS and uploads the
# installers. Local Windows builds go through scripts/build.ps1; this
# workflow is what produces the Linux and macOS artifacts when you push a
# tag (or run it by hand from the Actions tab).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: weloury-windows
          - os: ubuntu-22.04
            artifact: weloury-linux
          - os: macos-14
            artifact: weloury-macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            smartmontools

      - name: Install smartmontools (Windows)
        if: runner.os == 'Windows'
        run: choco install smartmontools -y

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop

      - name: Install the Tauri CLI
        working-directory: frontend
        run: npm ci

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: bash scripts/build.sh

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/desktop/target/release/bundle/**
